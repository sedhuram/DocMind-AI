services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - GENERATION_MODEL=${GENERATION_MODEL:-gemini-3.6-flash}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-gemini}
      # `localhost` inside this container is the container itself, not the host, so an
      # Ollama installed on the host machine is reached via host.docker.internal (see
      # extra_hosts below, which makes that name resolve on Linux too).
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.6:35b}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-150}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-5}
      - CONTEXT_CHAR_BUDGET=${CONTEXT_CHAR_BUDGET:-6000}
      - LOW_CONFIDENCE_THRESHOLD=${LOW_CONFIDENCE_THRESHOLD:-0.3}
      - CONVERSATION_WINDOW_TURNS=${CONVERSATION_WINDOW_TURNS:-4}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-20}
      - SQLITE_PATH=/app/sqlite/docmind.db
    # Docker Desktop (Mac/Windows) resolves host.docker.internal natively; on a Linux
    # host it does not exist unless mapped to the gateway like this. Harmless where
    # it's already built in.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data/static:/app/data/static
      - ./backend/data/uploads:/app/data/uploads
      - ./backend/vector_db:/app/vector_db
      - backend_sqlite:/app/sqlite
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The lifespan hook bootstraps data/static/ with synchronous embedding calls before
      # /api/health can respond; without a grace period a slow host would exhaust
      # interval*retries (50s) and be marked unhealthy mid-bootstrap.
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    # NOTE: NEXT_PUBLIC_API_BASE_URL is a build-time value for Next.js (inlined via
    # webpack DefinePlugin during `next build`), so it is passed via build.args above.
    # It is also set here at runtime for tooling that inspects container env vars;
    # it has no effect on the already-built client bundle.
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_sqlite:
